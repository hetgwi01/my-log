name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v4  # 사용자님의 메인 브랜치

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 기본 Quartz 소스코드 체크아웃
      - name: Checkout Quartz (Base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Private 노트 저장소 체크아웃 (비밀번호: GH_TOKEN 사용)
      - name: Checkout Private Notes
        uses: actions/checkout@v4
        with:
          repository: hetgwi01/Obsidian_Note
          token: ${{ secrets.GH_TOKEN }}
          path: temp_notes

      # 3. portfolio 저장소 체크아웃
      - name: Checkout Portfolio Repo
        uses: actions/checkout@v4
        with:
          repository: hetgwi01/portfolio
          token: ${{ secrets.GH_TOKEN }}
          path: temp_portfolio

      # 4. 하이브리드 동기화 및 스마트 경로 로직
      - name: Hybrid Sync & Smart Routing
        run: |
          rm -rf content
          mkdir -p content/portfolio

          # [A] Public 노트: 전체 복사
          if [ -d "temp_notes/public" ]; then
            cp -r temp_notes/public/* content/
          fi

          # [B] Private 노트: 슬러그 기반 스마트 이동
          find temp_notes/private -name "*.md" | while read -r file; do
            if grep -qi "publish: true" "$file"; then
              # 1. 파일에서 slug 값 추출 (없으면 기존 경로 사용)
              # 예: slug: /cs/db/ -> cs/db 추출
              target_slug=$(grep -m 1 "slug:" "$file" | sed 's/slug://g' | sed 's/\"//g' | sed "s/'//g" | xargs | sed 's/^\///' | sed 's/\/$//')
              
              if [ -n "$target_slug" ]; then
                # 슬러그가 있는 경우: 슬러그 경로로 이동
                dest_dir="content/$(dirname "$target_slug")"
                dest_file="content/$target_slug.md"
                mkdir -p "$dest_dir"
                cp "$file" "$dest_file"
                echo "🚀 Routed by Slug: $target_slug"
              else
                # 슬러그가 없는 경우: 원래 폴더 구조 유지
                rel_path=${file#temp_notes/private/}
                dir_path=$(dirname "$rel_path")
                mkdir -p "content/$dir_path"
                cp "$file" "content/$rel_path"
                echo "📄 Routed by Path: $rel_path"
              fi

              # 리소스(이미지) 복사 로직 유지
              src_res_dir="$(dirname "$file")/resources"
              if [ -d "$src_res_dir" ]; then
                # 슬러그 경로 하위에 resources 폴더 생성
                res_dest="content/$(dirname "$target_slug")/resources"
                mkdir -p "$res_dest"
                cp -r "$src_res_dir"/* "$res_dest/"
              fi
            fi
          done

          # [C] 포트폴리오 저장소 전체 통합
          if [ -d "temp_portfolio" ]; then
            echo "Integrating Portfolio..."
            # 모든 파일 복사 (README.md 포함)
            cp -r temp_portfolio/* content/portfolio/
            # README.md를 index.md로 강제 변경 (메인 화면용)
            if [ -f "content/portfolio/README.md" ]; then
              mv content/portfolio/README.md content/portfolio/index.md
            fi
            # 포트폴리오 내부 파일들의 이미지 경로 등 확인을 위해 목록 출력
            ls -R content/portfolio
          fi

          rm -rf temp_notes temp_portfolio

      # 5. Quartz 빌드 환경 설정 및 실행
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      # 6. 결과물 업로드
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4