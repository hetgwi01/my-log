name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v4 # 사용자님의 메인 브랜치
  # 이벤트
  repository_dispatch:
    types: [update-notes, update-portfolio]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 기본 Quartz 소스코드 체크아웃
      - name: Checkout Quartz (Base)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 2. Private 노트 저장소 체크아웃 (비밀번호: GH_TOKEN 사용)
      - name: Checkout Private Notes
        uses: actions/checkout@v6
        with:
          repository: hetgwi01/Obsidian_Note
          token: ${{ secrets.QUARTZ_READER_TOKEN }}
          path: temp_notes

      # 3. portfolio 저장소 체크아웃
      - name: Checkout Portfolio Repo
        uses: actions/checkout@v6
        with:
          repository: hetgwi01/portfolio
          token: ${{ secrets.QUARTZ_READER_TOKEN }}
          path: temp_portfolio

      # [추가] 3.5 단계: Quartz 빌드 전 파일명 및 링크 정제
      # 모든 파일이 content 폴더에 모인 직후, 빌드 전 실행합니다.
      - name: Sanitize filenames and links
        run: python3 scripts/sanitize.py

      - name: Sanitize filenames and links
        run: |
          python3 scripts/sanitize.py
          echo "=== Design Pattern.md 내용 확인 ==="
          grep "\[\[" temp_notes/private/Design\ Pattern.md || echo "위키링크 없음"

      # 4. 사용자 정의 구조 보존 동기화 (이미지 및 포트폴리오)
      - name: Pure Mirroring Sync
        run: |
          # 1. content 폴더 초기화
          rm -rf content
          mkdir -p content/portfolio

          # [A] Public: 원본 그대로 복사
          if [ -d "temp_notes/public" ]; then
            cp -r temp_notes/public/* content/
          fi

          # [B] Private: Slug 계층을 물리 폴더로 변환
          find temp_notes/private -name "*.md" | while read -r file; do
            if grep -qi "publish: true" "$file"; then
              # 1. slug 값 정밀 추출 (앞뒤 공백/따옴표 제거, 앞뒤 슬래시만 제거)
              # 예: slug: "/cs/db/note/" -> cs/db/note
              raw_slug=$(grep -m 1 "^slug:" "$file" | sed 's/slug://g' | sed 's/\"//g' | sed "s/'//g" | xargs)
              slug=${raw_slug#/} # 앞 슬래시 제거
              slug=${slug%/} # 뒤 슬래시 제거

              if [ -n "$slug" ]; then
                # 2. 계층 구조 생성 (mkdir -p 가 공통 경로를 자동으로 묶어줍니다)
                dest_dir="content/$(dirname "$slug")"
                dest_file="content/$slug.md"

                mkdir -p "$dest_dir"
                cp "$file" "$dest_file"

                # 3. 이미지 리소스도 계층에 맞춰 복사
                src_res_dir="$(dirname "$file")/resources"
                if [ -d "$src_res_dir" ]; then
                  cp -r "$src_res_dir" "$dest_dir/"
                fi
                echo "📁 Grouped in: $(dirname "$slug") -> $(basename "$slug")"
              else
                # slug 없는 경우 예외 처리 (원본 유지)
                rel_path=${file#temp_notes/private/}
                mkdir -p "content/$(dirname "$rel_path")"
                cp "$file" "content/$rel_path"
              fi
            fi
          done

          # [C] 포트폴리오: 사용자님이 설계한 구조 그대로 전체 복사
          if [ -d "temp_portfolio" ]; then
            echo "Syncing Portfolio repository (As-is)..."
            # 사용자님이 이미 index.md 등을 구현해두셨으므로 아무것도 수정하지 않고 통째로 복사합니다.
            cp -r temp_portfolio/* content/portfolio/
            # .git 폴더 등이 따라오지 않게 정리만 합니다.
            rm -rf content/portfolio/.git
          fi

          rm -rf temp_notes temp_portfolio

      # 5. Quartz 빌드 환경 설정 및 실행
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      # 6. 결과물 업로드
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
