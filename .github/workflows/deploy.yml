name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v4  # 사용자님이 사용 중인 브랜치 이름

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      # - name: Build Quartz
      #   run: npx quartz build
      
      - name: Build Quartz
        run: |
          # 심볼릭 링크가 있다면 제거하고 실제 폴더로 복사 (오류 방지)
          if [ -L content ]; then
            rm content
            cp -r "사용자님의_옵시디언_폴더_경로" content 2>/dev/null || mkdir content
          fi
          npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4