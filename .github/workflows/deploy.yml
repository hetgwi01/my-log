name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v4  # 사용자님의 메인 브랜치

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 기본 Quartz 소스코드 체크아웃
      - name: Checkout Quartz (Base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Private 노트 저장소 체크아웃 (비밀번호: GH_TOKEN 사용)
      - name: Checkout Private Notes
        uses: actions/checkout@v4
        with:
          repository: hetgwi01/Obsidian_Note
          token: ${{ secrets.GH_TOKEN }}
          path: temp_notes

      # 3. portfolio 저장소 체크아웃
      - name: Checkout Portfolio Repo
        uses: actions/checkout@v4
        with:
          repository: hetgwi01/portfolio
          token: ${{ secrets.GH_TOKEN }}
          path: temp_portfolio

      # 4. 사용자 정의 구조 보존 동기화 (이미지 및 포트폴리오)
      - name: Pure Mirroring Sync
        run: |
          # 1. content 폴더 초기화
          rm -rf content
          mkdir -p content/portfolio

          # [A] Public: 원본 그대로 복사
          if [ -d "temp_notes/public" ]; then
            cp -r temp_notes/public/* content/
          fi

          # [B] Private: slug 값을 읽어 실제 경로 재배치
          find temp_notes/private -name "*.md" | while read -r file; do
            if grep -qi "publish: true" "$file"; then
              # 1. slug 값 추출 (예: /cs/db/my-note -> cs/db/my-note)
              slug=$(grep -m 1 "^slug:" "$file" | awk '{print $2}' | sed 's/[\" \/]//g' | sed 's/\/$//')
              
              if [ -n "$slug" ]; then
                # slug가 있는 경우: 해당 경로로 폴더 생성 및 이동
                dest_dir="content/$(dirname "$slug")"
                dest_file="content/$slug.md"
                mkdir -p "$dest_dir"
                cp "$file" "$dest_file"
                
                # 이미지 폴더(resources)가 있다면 이동한 위치 옆으로 복사
                src_res_dir="$(dirname "$file")/resources"
                if [ -d "$src_res_dir" ]; then
                  cp -r "$src_res_dir" "$dest_dir/"
                fi
                echo "🚀 Slug Routed: $slug"
              else
                # slug가 없는 경우: 기존 상대 경로 유지
                rel_path=${file#temp_notes/private/}
                mkdir -p "content/$(dirname "$rel_path")"
                cp "$file" "content/$rel_path"
                
                if [ -d "$(dirname "$file")/resources" ]; then
                  cp -r "$(dirname "$file")/resources" "content/$(dirname "$rel_path")/"
                fi
              fi
            fi
          done

          # [C] 포트폴리오: 사용자님이 설계한 구조 그대로 전체 복사
          if [ -d "temp_portfolio" ]; then
            echo "Syncing Portfolio repository (As-is)..."
            # 사용자님이 이미 index.md 등을 구현해두셨으므로 아무것도 수정하지 않고 통째로 복사합니다.
            cp -r temp_portfolio/* content/portfolio/
            # .git 폴더 등이 따라오지 않게 정리만 합니다.
            rm -rf content/portfolio/.git
          fi

          rm -rf temp_notes temp_portfolio

      # 5. Quartz 빌드 환경 설정 및 실행
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      # 6. 결과물 업로드
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4