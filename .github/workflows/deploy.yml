name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v4  # 사용자님의 메인 브랜치

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 기본 Quartz 소스코드 체크아웃
      - name: Checkout Quartz (Base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Private 노트 저장소 체크아웃 (비밀번호: GH_TOKEN 사용)
      - name: Checkout Private Notes
        uses: actions/checkout@v4
        with:
          repository: hetgwi01/Obsidian_Note
          token: ${{ secrets.GH_TOKEN }}
          path: temp_notes

      # 3. portfolio 저장소 체크아웃
      - name: Checkout Portfolio Repo
        uses: actions/checkout@v4
        with:
          repository: hetgwi01/portfolio
          token: ${{ secrets.GH_TOKEN }}
          path: temp_portfolio

      # 4. 하이브리드 동기화 및 필터링 로직
      - name: Hybrid Sync & Filter Logic
        run: |
          # 1. 기존 content 폴더 완전 초기화
          rm -rf content
          mkdir -p content/portfolio

          # 2. [Public] 무조건 전체 복사
          if [ -d "temp_notes/public" ]; then
            echo "Copying public notes..."
            cp -r temp_notes/public/* content/
          fi

          # 3. [Private] 하나씩 검사하며 선별 복사
          echo "Filtering private notes..."
          # 모든 md 파일을 찾아서 루프를 돕니다.
          find temp_notes/private -name "*.md" | while read -r file; do
            # 파일 내용 중에 publish: true 가 있는지 검사 (대소문자 무시)
            if grep -qi "publish: true" "$file"; then
              # 상대 경로 계산
              rel_path=${file#temp_notes/private/}
              dir_path=$(dirname "$rel_path")
              
              # 목적지 생성 및 복사
              mkdir -p "content/$dir_path"
              cp "$file" "content/$rel_path"
              echo "✅ Published: $rel_path"

              # 리소스(이미지) 폴더 처리
              src_res_dir="$(dirname "$file")/resources"
              if [ -d "$src_res_dir" ]; then
                cp -r "$src_res_dir" "content/$dir_path/"
              fi
            fi
          done

          # 4. [Daiso-book] 포트폴리오 복사
          if [ -d "temp_portfolio" ]; then
            cp -r temp_portfolio/* content/portfolio/
            # README.md가 있다면 index.md로 이름을 바꿔서 메인 화면으로 만듦
            if [ -f "content/portfolio/README.md" ]; then
              mv content/portfolio/README.md content/portfolio/index.md
            fi
          fi

          rm -rf temp_notes temp_portfolio

      # 5. Quartz 빌드 환경 설정 및 실행
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      # 6. 결과물 업로드
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4